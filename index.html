e=false;this.ball=this.orbitPoint();this.message='';this.messageTime=0;this.trail=[]}\n node(i){return Physics.position(this.level.nodes[i],this.time)}\n orbitPoint(){const p=this.node(this.current);return{x:p.x+Math.cos(this.angle)*35,y:p.y+Math.sin(this.angle)*35}}\n messageFor(text){this.message=text;this.messageTime=1.4}\n fail(reason){this.state='dead';this.reason=reason}\n gateOpen(g){return (!g.key||this.keys.has(g.key))&&(!g.switch||this.switches.has(g.switch))}\n goalReady(){return (this.level.required||[]).every(i=>this.visited.has(i))&&(!this.level.needGravity||this.gravityUsed)&&(!this.level.needPortal||this.portalUsed)&&(!this.level.goalKey||this.keys.has(this.level.goalKey))&&(!this.level.goalSwitch||this.switches.has(this.level.goalSwitch))}\n action(){if(this.state!=='playing'||this.flight)return;this.used++;const n=this.level.nodes[this.current];if(n.fragile)this.consumed.add(this.current);const p=this.orbitPoint();this.ball={...p,vx:-Math.sin(this.angle)*290,vy:Math.cos(this.angle)*290};this.flight=true;this.leftSource=false;this.travelTime=0;this.trail=[]}\n capture(i,miss){const n=this.level.nodes[i];if(this.consumed.has(i)){this.fail('一次性星球已崩解，不能再返回。请选择另一条路线。');return}if(n.switch&&this.level.goalKey&&!this.keys.has(this.level.goalKey)){this.fail('开关需要金色钥匙，先去钥匙星。');return}if(n.goal&&!this.goalReady()){this.fail(this.level.lockHint||'还需要先经过本关标出的中继，再进入终点。');return}this.current=i;this.visited.add(i);this.flight=false;const p=this.node(i);this.angle=Math.atan2(this.ball.y-p.y, this.ball.x-p.x);const perfect=miss\u003c=10;this.combo=perfect?this.combo+1:0;this.perfects+=+perfect;this.score+=perfect?20+(this.combo-1)*5:10;this.messageFor(perfect?`PERFECT ×${this.combo}`:'捕获成功');if(n.key){this.keys.add(n.key);this.messageFor('获得钥匙 · 金色锁已解除')}if(n.switch){this.switches.add(n.switch);this.messageFor('开关已激活 · 蓝色闸门打开')}this.trail=[];if(n.goal)this.state='won';else if(this.used>=this.level.budget)this.fail('发射次数用完了，还没到达终点。')}\n step(dt){if(this.state!=='playing')return;this.time+=dt;this.messageTime-=dt;this.portalCooldown=Math.max(0,this.portalCooldown-dt);if(!this.flight){this.angle+=dt*1.65;this.ball=this.orbitPoint();return}this.travelTime+=dt;const old={x:this.ball.x,y:this.ball.y};\n for(const g of this.level.gravity||[]){const dx=g.x-this.ball.x,dy=g.y-this.ball.y,d=Math.hypot(dx,dy);if(d\u003cg.range){this.gravityUsed=true;const force=g.force*(1-d/g.range);this.ball.vx+=dx/Math.max(d,1)*force*dt;this.ball.vy+=dy/Math.max(d,1)*force*dt;const v=Math.hypot(this.ball.vx,this.ball.vy);this.ball.vx=this.ball.vx/v*290;this.ball.vy=this.ball.vy/v*290}}\n this.ball.x+=this.ball.vx*dt;this.ball.y+=this.ball.vy*dt;this.trail.push(old);if(this.trail.length>100)this.trail.shift();let nearest=null;const add=(event,t)=>{if(t!==null&&(!nearest||t\u003cnearest.t))nearest={...event,t}};const source=this.node(this.current);if(Math.hypot(this.ball.x-source.x,this.ball.y-source.y)>48)this.leftSource=true;\n this.level.nodes.forEach((n,i)=>{if(i===this.current&&!this.leftSource)return;const p=this.node(i),prev=Physics.position(n,this.time-dt),a={x:old.x-prev.x,y:old.y-prev.y},b={x:this.ball.x-p.x,y:this.ball.y-p.y},dx=b.x-a.x,dy=b.y-a.y;add({type:'node',i,miss:Math.abs(a.x*dy-a.y*dx)/Math.max(.001,Math.hypot(dx,dy))},Physics.hit(a,b,{x:0,y:0},n.r||38))});\n for(const p of this.level.obstacles||[])add({type:'obstacle'},Physics.hit(old,this.ball,p,p.r+6));\n for(const g of this.level.gravity||[])add({type:'core'},Physics.hit(old,this.ball,g,g.r+6));\n for(const g of this.level.gates||[])if(!this.gateOpen(g))add({type:'gate'},Physics.hit(old,this.ball,g,g.r+6));\n if(this.portalCooldown===0)for(const p of this.level.portals||[])add({type:'portal',portal:p},Physics.hit(old,this.ball,p.entry,p.r));\n if(nearest){this.ball.x=old.x+(this.ball.x-old.x)*nearest.t;this.ball.y=old.y+(this.ball.y-old.y)*nearest.t;if(nearest.type==='node')this.capture(nearest.i,nearest.miss);else if(nearest.type==='portal'){const p=nearest.portal,c=Math.cos(p.rotation),s=Math.sin(p.rotation),vx=this.ball.vx*c-this.ball.vy*s,vy=this.ball.vx*s+this.ball.vy*c;this.ball={x:p.exit.x+vx/290*(p.r+9),y:p.exit.y+vy/290*(p.r+9),vx,vy};this.portalCooldown=.3;this.portalUsed=true;this.trail=[];this.messageFor('传送完成 · 航向旋转 90°')}else this.fail(nearest.type==='core'?'撞到了引力核心，要从它旁边掠过。':nearest.type==='gate'?'闸门还未打开，先捕获钥匙星和开关星。':'撞上了红色陨石，试试绕行。');return}\n if(this.ball.x\u003c -70||this.ball.x>670||this.ball.y\u003c70||this.ball.y>650||this.travelTime>6)this.fail('飞出了星图，调整角度再试一次。')}\n}\nconst exported={Physics,OrbitGame};if(typeof module!=='undefined'&&module.exports)module.exports=exported;else root.OrbitEngine=exported;\n})(typeof globalThis!=='undefined'?globalThis:this);\n\r\n\u003c/script>\u003cscript>/* Each stage declares its objects, rules and objectives, independent of rendering. */\nconst stages=[\n {name:'01 · 第一束引力',tag:'基础',brief:'一跳到达金色终点。观察短虚线，判断切线方向。',budget:2,nodes:[{x:110,y:300},{x:365,y:300,goal:true}]},\n {name:'02 · 连续跃迁',tag:'连续',brief:'经过两颗中继星球抵达终点，最多 4 次发射。',budget:4,required:[1,2],nodes:[{x:85,y:410},{x:220,y:255},{x:385,y:395},{x:520,y:215,goal:true}]},\n {name:'03 · 近路还是稳路',tag:'选路',brief:'3 次内抵达小终点，可以经过中继，也可以直接跳终点。',budget:3,nodes:[{x:85,y:395},{x:245,y:215},{x:435,y:360,r:29,goal:true}]},\n {name:'04 · 追上流星',tag:'预判',brief:'先捕获移动中继，再抵达终点。瞄准它将要到达的位置。',budget:3,required:[1],nodes:[{x:90,y:390},{x:280,y:260,move:{axis:'x',amp:65,rate:.9}},{x:495,y:390,goal:true}]},\n {name:'05 · 绕过禁区',tag:'绕障',brief:'借上方中继绕过红色陨石，3 次内抵达终点。',budget:3,nodes:[{x:90,y:400},{x:275,y:195},{x:485,y:400,goal:true}],obstacles:[{x:285,y:395,r:66}]},\n {name:'06 · 引力弹弓',tag:'借力',brief:'一跳掠过紫色引力场，借弯曲航线抵达终点。别撞核心！',budget:1,needGravity:true,lockHint:'本关需要先掠过紫色引力场，试试借力弯曲航线。',nodes:[{x:90,y:420},{x:490,y:330,r:60,goal:true}],gravity:[{x:300,y:280,r:22,range:155,force:1000}],obstacles:[{x:300,y:385,r:65}]},\n {name:'07 · 折叠空间',tag:'传送',brief:'进入青色入口，从紫色出口飞出；航向逆时针旋转 90°。',budget:1,needPortal:true,lockHint:'需要穿过传送门后才能激活终点。',nodes:[{x:90,y:430},{x:410 3ca href=\"index.html\">返回选择页\u003c/a>\u003c/section>\u003c/div>`);\n const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),overlay=document.querySelector('.overlay'),panel=overlay.querySelector('p'),button=overlay.querySelector('button');let best=0;try{best=+localStorage.getItem(id)||0}catch{}document.querySelector('#best').textContent=best;\n const api={canvas,ctx,w:0,h:0,score:0,combo:0,state:'ready',notice:'',noticeTime:0,onStart:()=>{},onAction:()=>{},update:()=>{},draw:()=>{},clamp};\n function resize(){api.w=innerWidth;api.h=innerHeight;let d=Math.min(devicePixelRatio||1,2);canvas.width=api.w*d;canvas.height=api.h*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();\n api.message=(s)=>{api.notice=s;api.noticeTime=1.25};\n api.award=(perfect)=>{api.combo=perfect?api.combo+1:0;let points=perfect?20+Math.min(api.combo-1,10)*5:10;api.score+=points;document.querySelector('#score').textContent=api.score;api.message(perfect?`PERFECT  +${points}  ×${api.combo}`:`成功 +${points}`);if(api.score>best){best=api.score;document.querySelector('#best').textContent=best;try{localStorage.setItem(id,best)}catch{}}};\n api.fail=(reason)=>{api.state='dead';panel.textContent=`${reason}\\n本局 ${api.score} 分 · 最高 ${best} 分`;button.textContent='立即重开';overlay.style.display='grid'};\n function start(){api.score=0;api.combo=0;api.noticeTime=0;document.querySelector('#score').textContent=0;api.state='playing';overlay.style.display='none';api.onStart()}\n button.onclick=()=>{if(api.state==='paused'){api.state='playing';overlay.style.display='none'}else start()};panel.textContent=instructions+'\\n普通成功 +10 · 精准 +20 起\\n连续精准获得额外连击奖励';\n function pause(){if(api.state!=='playing')return;api.state='paused';panel.textContent='已暂停，准备好再继续。';button.textContent='继续挑战';overlay.style.display='grid'}document.querySelector('.pause').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});\n canvas.addEventListener('pointerdown' avel+=speed*dt;trail.push({x:ball.x,y:ball.y});if(trail.length>35)trail.shift();let dx=ball.x-ox,dy=ball.y-oy,t=Arcade.clamp(((target.x-ox)*dx+(target.y-oy)*dy)/(dx*dx+dy*dy),0,1);if(Math.hypot(ox+dx*t-target.x,oy+dy*t-target.y)\u003c=capture){let miss=Math.abs((target.x-ox)*ball.vy-(target.y-oy)*ball.vx)/speed;orbit.award(miss\u003c=perfect);current=target;angle=Math.atan2(ball.y-current.y,ball.x-current.x);target=makeTarget();flight=false;steps++;trail=[]}else if(travel>650)orbit.fail('偏离了目标轨道。等切线变绿再出发！')};\norbit.draw=()=>{const c=orbit.ctx,w=orbit.w,h=orbit.h,scale=Math.min(w/620,(h-150)/620,1.15);c.fillStyle='#0b1220';c.fillRect(0,0,w,h);if(!current)return;c.save();c.translate(w/2,h/2+25);c.scale(scale,scale);c.translate(-camera.x,-camera.y);c.lineWidth=1;for(let i=0;i\u003c70;i++){let x=((i*137)%1100)-550+camera.x,y=((i*223)%1000)-500+camera.y;c.fillStyle='#3a526b';c.fillRect(x,y,2,2)}\nfunction planet(p,isTarget){c.beginPath();c.arc(p.x,p.y,isTarget?capture:radius,0,Math.PI*2);c.strokeStyle=isTarget?'#68e7c177':'#799ab455';c.setLineDash(isTarget?[5,6]:[]);c.stroke();c.setLineDash([]);c.beginPath();c.arc(p.x,p.y,isTarget?perfect:23,0,Math.PI*2);c.fillStyle=isTarget?'#ffce7633':'#345d77';c.fill();c.strokeStyle=isTarget?'#ffce76':'#5785a1';c.stroke();if(isTarget){c.fillStyle='#a2c5d2';c.font='12px system-ui';c.textAlign='center';c.fillText('下一站',p.x,p.y-57)}}planet(current,false);planet(target,true);\nif(!flight){let a=aim();c.beginPath();c.moveTo(a.p.x,a.p.y);c.lineTo(a.p.x+a.vx*340,a.p.y+a.vy*340);c.strokeStyle=a.along>0&&a.miss\u003c=capture?(a.miss\u003c=perfect?'#ffce76':'#68e7c1'):'#799ab466';c.setLineDash([5,7]);c.stroke();c.setLineDash([])}else{c.beginPath();trail.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.strokeStyle='#77edcc88';c.lineWidth=3;c.stroke()}c.beginPath();c.arc(ball.x,ball.y,7,0,Math.PI*2);c.fillStyle='#fff';c.shadowColor='#75edce';c.shadowBlur=14;c.fill();c.restore()};\norbit.onStart();})();\n\r\n\u003c/script>\u003cscript>document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const href=a.getAttribute('href');if(['index.html','levels.html','planet.html'].includes(href)){e.preventDefault();parent.postMessage({starHopNavigate:href},'*')}});\u003c/script>\u003c/body>\u003c/html>\n\r\n"}</script><script>
